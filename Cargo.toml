[package]
name = "crosshair"
version = "1.0.0"
edition = "2021"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }
tiny-skia = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
